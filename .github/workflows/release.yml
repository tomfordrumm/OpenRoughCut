name: Build candidate (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.17.0"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Audit application and build dependencies
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run app:build

  mac:
    needs: validate
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-release-runtime.mjs darwin ${{ matrix.arch }}
      - run: npm run dist:mac:${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-mac-${{ matrix.arch }}
          path: |
            release/OpenRoughCut-*-mac-${{ matrix.arch }}.dmg
            release/OpenRoughCut-*-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-release-runtime.mjs win32 x64
      - name: Build Windows installer
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "windows-build.log"
          npm run dist:win 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $lines = Get-Content $logPath |
              ForEach-Object { ($_ -replace "`e\[[0-9;?]*[ -/]*[@-~]", "").Trim() } |
              Where-Object { $_ }
            $diagnostics = @(
              $lines | Where-Object { $_ -match "(?i)(error|failed|failure|fatal|cannot|exception|enoent|exit code|⨯)" } | Select-Object -Last 12
              $lines | Select-Object -Last 12
            ) | Select-Object -Unique
            foreach ($line in $diagnostics) {
              $message = if ($line.Length -gt 3500) { $line.Substring(0, 3500) } else { $line }
              $annotation = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
              Write-Output "::error title=Windows packaging diagnostic::$annotation"
            }
            exit $exitCode
          }
      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-log
          path: ${{ runner.temp }}/windows-build.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-x64
          path: release/OpenRoughCut-*-win-x64.exe
          if-no-files-found: error
          retention-days: 7
